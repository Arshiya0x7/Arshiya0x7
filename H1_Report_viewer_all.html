<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HackerOne Report ID Viewer</title>
  <style>
    body { font-family: Inter, Tahoma, sans-serif; background: #020617; color: #e5e7eb; margin: 0; padding: 30px; }
    h1 { text-align: center; color: #38bdf8; }
    .container { max-width: 1200px; margin: auto; }
    input { width: 100%; height: 45px; background: #020617; color: #93c5fd; border: 1px solid #1e293b; border-radius: 12px; padding: 0 14px; font-size: 16px; margin-bottom: 10px; }
    button { padding: 12px 22px; background: linear-gradient(135deg, #2563eb, #38bdf8); border: none; border-radius: 10px; color: white; font-size: 15px; cursor: pointer; }
    .card { margin-top: 30px; background: #020617; border-radius: 18px; padding: 26px; box-shadow: 0 0 35px rgba(56,189,248,0.18); }
    .section-title { margin-top: 25px; margin-bottom: 10px; color: #38bdf8; font-size: 18px; }
    .row { display: grid; grid-template-columns: 230px 1fr; margin-bottom: 12px; gap: 8px; }
    .label { color: #94a3b8; }
    .value { color: #e5e7eb; font-weight: 500; }
    .badge { display: inline-block; padding: 5px 10px; border-radius: 6px; font-size: 12px; margin-right: 5px; background: #1e293b; }
    .severity { background: #7c2d12; color: #fdba74; }
    .votes { background: #14532d; color: #86efac; }
    .bounty { background: #1e3a8a; color: #93c5fd; }
    .date { background: #374151; color: #d1d5db; }
    .info { background: #1e293b; color: #94a3b8; }
    a { color: #38bdf8; text-decoration: none; }
    pre { background: #020617; border: 1px solid #1e293b; padding: 14px; border-radius: 10px; white-space: pre-wrap; font-size: 13px; line-height: 1.7; }
    .loading { margin-top: 20px; color: #fbbf24; }
    .error { margin-top: 20px; color: #f87171; }
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
    .metric-item { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #1e293b; }
    .metric-label { font-size: 12px; color: #94a3b8; }
    .metric-value { font-size: 14px; color: #e5e7eb; font-weight: 500; }
    .voters-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .voter-badge { background: #374151; padding: 3px 8px; border-radius: 4px; font-size: 11px; }

    /* Markdown Styling */
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: #7dd3fc; margin-top: 18px; }
    .markdown-body code { background: #020617; padding: 3px 6px; border-radius: 6px; color: #fbbf24; }
    .markdown-body pre code { display: block; padding: 12px; }
    .markdown-body ul { padding-left: 20px; }

    /* Attachments */
    .attachment { margin: 16px 0; }
    .attachment img, .attachment video { max-width: 100%; border-radius: 10px; border: 1px solid #1e293b; }
    .attachment-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .attachment-item { background: #020617; border: 1px solid #1e293b; border-radius: 12px; padding: 10px; font-size: 12px; }
  </style>
</head>
<body>

<div class="container">
  <h1>HackerOne Report Viewer (By ID)</h1>

  <input id="reportId" placeholder="Enter Report ID (e.g. 3395290)" onkeydown="if(event.key==='Enter'){loadReport();}" />
  <button onclick="loadReport()">Fetch & Render</button>

  <div id="status"></div>
  <div id="output"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
function safe(val) { return val ?? "N/A"; }

// تابع برای گرفتن پارامتر از URL
function getUrlParameter(name) {
  name = name.replace(/[\[\]]/g, '\\$&');
  const regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
  const results = regex.exec(window.location.href);
  if (!results) return null;
  if (!results[2]) return '';
  return decodeURIComponent(results[2].replace(/\+/g, ' '));
}

// تابع برای قالب‌بندی تاریخ
function formatDate(dateString) {
  if (!dateString) return "N/A";
  try {
    const date = new Date(dateString);
    return date.toLocaleString('en-US', {
      year: 'numeric',
      month: 'short',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit',
      timeZoneName: 'short'
    });
  } catch (e) {
    return dateString;
  }
}

// تابع برای ایجاد لینک به گزارش اصلی
function createH1Link(url) {
  if (!url || url === "N/A") return "N/A";
  return `<a href="${url}" target="_blank" title="Open in HackerOne">${url}</a>`;
}

async function loadReport() {
  const idInput = document.getElementById("reportId");
  let id = idInput.value.trim();
  
  // اگر شناسه در فیلد ورودی خالی بود، سعی کن از پارامتر URL بگیر
  if (!id) {
    const urlId = getUrlParameter('id');
    if (urlId) {
      id = urlId;
      idInput.value = id;
    }
  }
  
  const output = document.getElementById("output");
  const status = document.getElementById("status");

  if (!id) {
    status.innerHTML = "<div class='error'>❌ Please enter a report ID or provide it in URL as ?id=XXXXX</div>";
    return;
  }

  const url = `https://raw.githubusercontent.com/Arshiya0x7/H1_Reports/refs/heads/main/Reports/${id}.json`;

  status.innerHTML = "<div class='loading'>⏳ Fetching report...</div>";
  output.innerHTML = "";

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("Report not found on GitHub");
    const data = await res.json();
    status.innerHTML = "";
    renderData(data);
    
    // به‌روزرسانی URL بدون رفرش صفحه
    const newUrl = window.location.pathname + '?id=' + id;
    window.history.pushState({ path: newUrl }, '', newUrl);
  } catch (err) {
    status.innerHTML = `<div class='error'>❌ ${err.message}</div>`;
  }
}

function renderData(data) {
  const output = document.getElementById("output");

  const severity = data.severity || {};
  const metrics = severity.metrics || {};
  const team = data.team || {};
  const teamProfile = team.profile || {};
  const scope = data.structured_scope || {};

  /* Build attachment map */
  const attachmentMap = {};
  (data.attachments || []).forEach(att => attachmentMap[att.id] = att);

  /* Inject attachments into markdown by replacing {F123} */
  let vulnText = data.vulnerability_information || "";
  vulnText = vulnText.replace(/\{F(\d+)\}/g, (match, id) => {
    const file = attachmentMap[id];
    if (!file) return match;

    if (file.type.startsWith("image/")) {
      return `\n\n<div class="attachment"><img src="${file.expiring_url}" alt="${file.file_name}"></div>\n`;
    }

    if (file.type.startsWith("video/")) {
      return `\n\n<div class="attachment"><video controls src="${file.expiring_url}"></video></div>\n`;
    }

    return `\n\n<a href="${file.expiring_url}" target="_blank">📎 ${file.file_name}</a>\n`;
  });

  const vulnHTML = marked.parse(vulnText);

  /* Build attachment list section */
  const attachmentsHTML = (data.attachments || []).length ? `
    <div class="section-title">📎 All Attachments</div>
    <div class="attachment-list">
      ${(data.attachments || []).map(att => `
        <div class="attachment-item">
          <div><strong>${att.file_name}</strong></div>
          <div>${att.type}</div>
          <div>${(att.file_size / 1024).toFixed(1)} KB</div>
          <a href="${att.expiring_url}" target="_blank">Open</a>
        </div>
      `).join("")}
    </div>
  ` : "";

  // ایجاد بخش معیارهای CVSS
  const cvssMetricsHTML = metrics && Object.keys(metrics).length > 0 ? `
    <div class="section-title">📊 CVSS 3.1 Metrics</div>
    <div class="metrics-grid">
      ${Object.entries(metrics).map(([key, value]) => `
        <div class="metric-item">
          <div class="metric-label">${key.replace(/_/g, ' ').toUpperCase()}</div>
          <div class="metric-value">${safe(value)}</div>
        </div>
      `).join('')}
    </div>
  ` : '';

  // ایجاد بخش رای‌دهندگان
  const votersHTML = data.voters && data.voters.length > 0 ? `
    <div class="row">
      <div class="label">Voters</div>
      <div class="value">
        <div class="voters-list">
          ${data.voters.map(voter => `<span class="voter-badge">${voter}</span>`).join('')}
        </div>
      </div>
    </div>
  ` : '';

  // ایجاد بخش محدوده هدف
  const scopeHTML = scope && (scope.asset_type || scope.asset_identifier) ? `
    <div class="section-title">🎯 Scope</div>
    <div class="row"><div class="label">Asset Type</div><div class="value">${safe(scope.asset_type)}</div></div>
    <div class="row"><div class="label">Asset Identifier</div><div class="value">${safe(scope.asset_identifier)}</div></div>
    <div class="row"><div class="label">Max Severity</div><div class="value"><span class="badge">${safe(scope.max_severity)}</span></div></div>
  ` : '';

  // ایجاد بخش خلاصه‌ها
  const summariesHTML = data.summaries && data.summaries.length > 0 ? `
    <div class="section-title">📋 Summaries</div>
    ${data.summaries.map(summary => `
      <div class="row">
        <div class="label">${safe(summary.category)} Summary</div>
        <div class="value">
          <span class="badge info">Can View: ${safe(summary['can_view?'])}</span>
          <span class="badge info">Can Create: ${safe(summary['can_create?'])}</span>
        </div>
      </div>
    `).join('')}
  ` : '';

  output.innerHTML = `
  <div class="card">

    <h2>${safe(data.title)}</h2>

    <div class="section-title">📝 Report Information</div>
    <div class="row"><div class="label">Report ID</div><div class="value">${safe(data.id)}</div></div>
    <div class="row"><div class="label">Global ID</div><div class="value"><span class="badge info">${safe(data.global_id)}</span></div></div>
    <div class="row"><div class="label">HackerOne URL</div><div class="value">${createH1Link(data.url)}</div></div>
    
    <div class="section-title">📊 Severity & Status</div>
    <div class="row"><div class="label">Severity Rating</div><div class="value"><span class="badge severity">${safe(data.severity_rating)}</span></div></div>
    <div class="row"><div class="label">Severity Score</div><div class="value"><span class="badge severity">${safe(severity.score)}</span></div></div>
    <div class="row"><div class="label">State</div><div class="value"><span class="badge">${safe(data.state)}</span></div></div>
    <div class="row"><div class="label">Substate</div><div class="value"><span class="badge">${safe(data.substate)} (${safe(data.readable_substate)})</span></div></div>
    
    ${cvssMetricsHTML}
    
    <div class="section-title">👥 People & Team</div>
    <div class="row"><div class="label">Reporter</div><div class="value">${safe(data.reporter?.username)}</div></div>
    <div class="row"><div class="label">Team</div><div class="value">${safe(teamProfile.name)} <span class="badge info">@${safe(team.handle)}</span></div></div>
    <div class="row"><div class="label">Team URL</div><div class="value">${createH1Link(team.url)}</div></div>
    
    <div class="section-title">💰 Bounty & Votes</div>
    <div class="row"><div class="label">Bounty</div><div class="value"><span class="badge bounty">${safe(data.formatted_bounty || data.bounty_amount)}</span> <span class="badge info">Has Bounty: ${safe(data['has_bounty?'])}</span></div></div>
    <div class="row"><div class="label">Vote Count</div><div class="value"><span class="badge votes">${safe(data.vote_count)}</span></div></div>
    ${votersHTML}
    
    <div class="section-title">🔧 Technical Details</div>
    <div class="row"><div class="label">Weakness</div><div class="value">${safe(data.weakness?.name)}</div></div>
    <div class="row"><div class="label">Stage</div><div class="value"><span class="badge info">${safe(data.stage)}</span></div></div>
    <div class="row"><div class="label">Visibility</div><div class="value"><span class="badge info">${safe(data.visibility)}</span></div></div>
    <div class="row"><div class="label">CVE IDs</div><div class="value">${data.cve_ids && data.cve_ids.length > 0 ? data.cve_ids.map(cve => `<span class="badge">${cve}</span>`).join(' ') : 'N/A'}</div></div>
    
    ${scopeHTML}
    
    <div class="section-title">📅 Dates</div>
    <div class="row"><div class="label">Created at</div><div class="value"><span class="badge date">${formatDate(data.created_at)}</span></div></div>
    <div class="row"><div class="label">Submitted at</div><div class="value"><span class="badge date">${formatDate(data.submitted_at)}</span></div></div>
    ${data.disclosed_at ? `<div class="row"><div class="label">Disclosed at</div><div class="value"><span class="badge date">${formatDate(data.disclosed_at)}</span></div></div>` : ''}
    ${data.team_member_agreed_on_going_public_at ? `<div class="row"><div class="label">Team agreed on public</div><div class="value"><span class="badge date">${formatDate(data.team_member_agreed_on_going_public_at)}</span></div></div>` : ''}
    ${data.allow_singular_disclosure_at ? `<div class="row"><div class="label">Allow disclosure at</div><div class="value"><span class="badge date">${formatDate(data.allow_singular_disclosure_at)}</span></div></div>` : ''}
    
    ${summariesHTML}
    
    <div class="section-title">📌 Vulnerability Details</div>
    <div class="markdown-body">${vulnHTML}</div>

    ${attachmentsHTML}

    <div class="section-title">ℹ️ Additional Information</div>
    <div class="row">
      <div class="label">Flags</div>
      <div class="value">
        <span class="badge info">Published: ${safe(data.is_published)}</span>
        <span class="badge info">Public: ${safe(data.public)}</span>
        <span class="badge info">Team Private: ${safe(data.team_private)}</span>
        <span class="badge info">Comments Closed: ${safe(data['comments_closed?'])}</span>
        <span class="badge info">Singular Disclosure Allowed: ${safe(data.singular_disclosure_allowed)}</span>
      </div>
    </div>

  </div>`;
}

// هنگام بارگذاری صفحه، اگر پارامتر id در URL وجود داشت، گزارش را بارگیری کن
document.addEventListener('DOMContentLoaded', function() {
  const urlId = getUrlParameter('id');
  if (urlId) {
    document.getElementById("reportId").value = urlId;
    loadReport();
  }
});
</script>

</body>
</html>
